# Cloudflare Worker do intermediário de álbuns (ver README.md). Os links dos álbuns NÃO ficam aqui: vão no segredo ALBUMS.
name = "devfest-album-proxy"
main = "worker.mjs"
compatibility_date = "2026-01-01"

# O sync do Sympla (🎫 Sincronizar Sympla) é disparado pelo Worker: de 1 em 1 hora (rede de segurança) e na hora, a pedido do site (POST /sync, quando o cartão não acha o e-mail). Na semana do evento dá pra subir pra */15. O token fica no segredo SYNC_GITHUB_TOKEN (nunca aqui).
[triggers]
crons = ["0 * * * *"]

[vars]
SYNC_REPO = "gdgcampinas/DevFest-Campinas-2026"
SYNC_WORKFLOW = "sync-sympla.yml"
# Onde ficam os clipes de vídeo do mural (anexos de uma release do GitHub; público, nada secreto). Rota /media/<arquivo.mp4>. Vazio = vídeos desligados.
MEDIA_BASE = "https://github.com/gdgcampinas/DevFest-Campinas-2026/releases/download/mural-video-2025/"
