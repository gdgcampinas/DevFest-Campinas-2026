name: Event report

# Relatório pro media kit e patrocinadores: inscritos, presença na porta,
# check-in e notas por palestra, palestrantes, avaliação do evento e comentários.
# Sob demanda (Actions > Run workflow) e a cada 30 min no dia do evento
# (28/11, cron em UTC: 11h às 22h = 08h às 19h de Brasília). O resultado
# aparece no resumo privado da execução. Sem os secrets, falha avisando.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 11-22 28 11 *"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build report
        run: node DevFestIA/tools/event-report/event-report.js
        env:
          SYMPLA_TOKEN: ${{ secrets.SYMPLA_TOKEN }}
          SYMPLA_EVENT_ID_HASH: s36cd5d
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
