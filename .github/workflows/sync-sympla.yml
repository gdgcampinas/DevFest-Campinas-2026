name: 🎫 Sincronizar Sympla

run-name: 🎫 Sincronizar Sympla${{ inputs.dry_run && ' (simulação)' || '' }}

# Sincroniza inscritos do Sympla com o Firestore (o Sympla não tem webhook). Quem dispara é o Worker do intermediário (DevFestIA/tools/album-proxy): cron de 1 em 1 hora e
# POST /sync na hora, quando o cartão "Eu vou!" não acha o e-mail. O agendamento do próprio GitHub saiu: rodava em média a cada 4 h e duplicava as rodadas. Sem os secrets
# configurados o job só avisa e termina com sucesso, sem gravar nada.
# Configuração (uma vez): secrets SYMPLA_TOKEN e FIREBASE_SERVICE_ACCOUNT no
# repositório. O hash do evento não é segredo e fica aqui.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Modo teste (lê o Sympla, não grava no Firestore)"
        type: boolean
        default: false

concurrency:
  group: sync-sympla
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync registrations
        run: node DevFestIA/tools/sympla-sync/sync.js
        env:
          SYMPLA_TOKEN: ${{ secrets.SYMPLA_TOKEN }}
          SYMPLA_EVENT_ID_HASH: s36cd5d
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
