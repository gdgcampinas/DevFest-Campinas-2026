name: Validate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JS syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            echo "checking $file"
            node --check "$file" || status=1
          done < <(find docs -name '*.js' -print0)
          exit $status

      - name: Check share metadata, sitemap and robots
        run: node DevFestIA/tools/check-meta.js

      - name: Check install flow and script dependencies
        run: node DevFestIA/tools/check-install.js
