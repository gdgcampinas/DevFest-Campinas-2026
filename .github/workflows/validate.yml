name: Validate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JS syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            echo "checking $file"
            node --check "$file" || status=1
          done < <(find docs/js -name '*.js' -print0)
          exit $status
